name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: '227216295282-3i89nkjf47795541qdi6u5k44tlmro4k.apps.googleusercontent.com'
      ORG_GRADLE_PROJECT_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://jsaur.duckdns.org/sentencelab' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure stable app signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SENTENCELAB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SENTENCELAB_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD" ]]; then
            echo "Stable signing secrets are absent. Using a temporary debug signature."
            exit 0
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both stable signing secrets must be configured together."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sentencelab-signing.p12"
          echo "SENTENCELAB_SIGNING_STORE_FILE=$RUNNER_TEMP/sentencelab-signing.p12" >> "$GITHUB_ENV"
          echo "SENTENCELAB_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Stable APK signing enabled."

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentenceLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
